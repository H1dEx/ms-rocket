syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/H1dEx/ms-rocket/shared/pkg/proto/common/v1;common_v1";

// Сессия
message Session {
    // UUID сессии
    string uuid = 1;
    // Время создания
    google.protobuf.Timestamp created_at = 2;
    // Время последнего обновления
    google.protobuf.Timestamp updated_at = 3;
    // Время истечения
    google.protobuf.Timestamp expires_at = 4;
}