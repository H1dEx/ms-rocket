syntax = "proto3";

package auth.v1;

import "common/v1/session.proto";
import "common/v1/user.proto";

option go_package = "github.com/H1dEx/ms-rocket/shared/pkg/proto/auth/v1;auth_v1";

// Сервис авторизации
service AuthService {
    // Вход в систему
    rpc Login(LoginRequest) returns (LoginResponse);
    // Получение информации о текущем пользователе
    rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
}

// Запрос на вход в систему
message LoginRequest {
    // Логин пользователя
    string login = 1;
    // Пароль пользователя
    string password = 2;
}

// Ответ на запрос на вход в систему
message LoginResponse {
    // UUID активной сессии
    string session_uuid = 1;
}

// Запрос информации о текущем пользователе
message WhoamiRequest {
    // UUID активной сессии
    string session_uuid = 1;
}

// Ответ на запрос информации о текущем пользователе
message WhoamiResponse {
    // Информация о текущей сессии
    common.v1.Session session = 1;
    // Владелец текущей сессии
    common.v1.User user = 2;
}